appId: dev.thunder.app
productName: Thunder
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/.cache/**/*"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.map"
asar: true
asarUnpack:
  - "node_modules/node-llama-cpp/**/*"
  - "node_modules/better-sqlite3/**/*"
extraResources:
  - from: resources/models.json
    to: models.json
  - from: public/thunder-public-key.pem
    to: thunder-public-key.pem
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
